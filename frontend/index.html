<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0f3f7" />
    <meta name="description" content="RootDrive file storage" />
    <link rel="icon" type="image/webp" href="/assets/icons/app.webp" />
    <link rel="apple-touch-icon" href="/assets/icons/app.webp" />
    <title>RootDrive</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("rootdrive-theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
